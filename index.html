<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: white;
        }

        .container {
            width: 500px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
        }

        .profile-image {
            width: 280px;
            height: 280px;
            object-fit: cover;
            display: block;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        label {
            width: 100px;
            font-weight: bold;
        }

        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 25px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>User profile</h1>
    <img
        class="profile-image"
        src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=500"
        alt="Profile"
    >

    <form id="userForm">

        <div class="form-group">
            <label>Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <hr>

        <div class="form-group">
            <label>Email:</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <hr>

        <div class="form-group">
            <label>Phone:</label>
            <input
                type="text"
                id="phone"
                placeholder="Enter phone number"
            >
        </div>

        <hr>

        <div class="form-group">
            <label>City:</label>
            <input
                type="text"
                id="city"
                placeholder="Enter city"
            >
        </div>

        <br>

        <button type="submit">
            Update Profile
        </button>

    </form>

    <p id="message"></p>

</div>


<script>

    const form = document.getElementById("userForm");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const city = document.getElementById("city").value;

        const user = {
            name: name,
            email: email,
            phone: phone,
            city: city
        };

        try {

            const response = await fetch("/api/users", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(user)
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("message").innerText =
                    "Profile saved successfully!";
            } else {
                document.getElementById("message").innerText =
                    "Error: " + data.message;
            }

        } catch (error) {
            
            console.log(error);

            document.getElementById("message").innerText =
                "Could not connect to server.";

        }

    });

</script>

</body>
</html>
